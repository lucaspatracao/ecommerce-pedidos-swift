# Perfil de testes: H2 em memória imitando o MySQL (MODE=MySQL).
# As MESMAS migrations do Flyway rodam aqui e o Hibernate valida o schema,
# então um erro de mapeamento quebra os testes antes de chegar ao MySQL.
#   DATABASE_TO_LOWER=TRUE  -> nomes de tabela em minúsculas, como no MySQL
#   DB_CLOSE_DELAY=-1       -> mantém o banco vivo enquanto a JVM dos testes existir
spring.datasource.url=jdbc:h2:mem:ecommerce_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
