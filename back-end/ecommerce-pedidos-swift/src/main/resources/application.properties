spring.application.name=ecommerce-pedidos-swift
server.port=8080

# Sem perfil informado, a aplicação sobe em "dev" (MySQL local).
spring.profiles.default=dev

# Lê variáveis de um arquivo .env na pasta do back-end, se ele existir.
# O .env NÃO é versionado (.gitignore); use o .env.example como modelo.
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------------------
# Banco de dados: valores vêm SEMPRE de variáveis de ambiente.
# DB_PASSWORD não tem valor padrão de propósito: sem ela a aplicação não sobe,
# e nenhuma senha fica gravada no repositório.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# O schema é criado e versionado pelo Flyway (src/main/resources/db/migration).
# O Hibernate apenas CONFERE se as entidades batem com as tabelas e falha na
# subida se algo divergir. Ele nunca cria nem altera tabelas sozinho.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Desliga o "Open Session in View": o acesso ao banco termina na camada de
# serviço (@Transactional). Assim, uma consulta preguiçosa esquecida falha
# cedo, em vez de gerar SQL escondido durante a serialização do JSON.
spring.jpa.open-in-view=false
