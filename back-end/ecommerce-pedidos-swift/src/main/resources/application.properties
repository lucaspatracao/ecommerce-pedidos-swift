spring.application.name=ecommerce-pedidos-swift
server.port=8080

# Configuração do banco de dados
# Preferencialmente configure via variáveis de ambiente (DB_URL, DB_USERNAME, DB_PASSWORD)
db.url=jdbc:mysql://localhost:3306/ecommerce?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.username=root
db.password=root123456

# Aplica as migrations de src/main/resources/db/migracao ao subir a aplicação
db.migracoes.automaticas=true
