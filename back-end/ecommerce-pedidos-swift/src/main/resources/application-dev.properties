# Perfil de desenvolvimento: MySQL local, banco dedicado "ecommerce_swift".
# Crie o banco uma vez (veja o README) e defina DB_USERNAME e DB_PASSWORD.
# DB_URL é opcional aqui: sem ela, usa o banco local abaixo.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_swift?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

# Mostra no console o SQL gerado pelo Hibernate, formatado (útil para estudar
# o que cada método do repositório executa e enxergar problemas de N+1).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
